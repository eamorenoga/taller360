spring:
  application:
    name: taller360
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:taller360}}"
    username: "${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:taller360}}"
    password: "${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:taller360}}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      url: "${REDIS_URL:redis://localhost:6379}"

server:
  port: "${PORT:${SERVER_PORT:8080}}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  security:
    max-failed-attempts: 5
    lock-minutes: 15
