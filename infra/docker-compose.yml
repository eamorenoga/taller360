services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taller360
      POSTGRES_USER: taller360
      POSTGRES_PASSWORD: taller360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taller360
      SPRING_DATASOURCE_USERNAME: taller360
      SPRING_DATASOURCE_PASSWORD: taller360
      JWT_SECRET: "change-me-change-me-change-me-change-me-change-me"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
