services:
  - type: web
    name: taller360-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taller360-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taller360-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: taller360-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: keyvalue
    name: taller360-redis
    plan: free
    ipAllowList: []

databases:
  - name: taller360-postgres
    databaseName: taller360
    user: taller360
    plan: free
